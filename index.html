<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern dashboard interface built with HTML and CSS.">
    <meta name="author" content="Ali Hamze">
    <title>Modern Dashboard UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="sidebar">
        <h1 class="logo-title">Dash</h1>
        <h1 class="x">X</h1>
        <p class="nav-item-active">Dashboard</p>
        <p class="nav-item">Analytics</p>
        <p class="nav-item">Projects</p>
        <p class="nav-item">Settings</p>
    </nav>
    <main>
        <h1 class="page-title">Dashboard</h1>
        <ul>
            <li class="stat-card">
                <div class="card-title">Revenue</div>
                <div class="card-value">$12,430</div>
            </li>
            <li class="stat-card">
                <div class="card-title">Users</div>
                <div class="card-value">1,284</div>
            </li>
            <li class="stat-card">
                <div class="card-title">Growth</div>
                <div class="card-value">+18%</div>
            </li>
        </ul>
        <footer class="projects-section">
            <h1 class="section-title">Recent Projects</h1>
            <div class="table-header">
                <div class="table-name">Name</div>
                <div class="table-status">Status</div>
                <div class="table-budget">Budget</div>
            </div>
            <hr>
            <div class="project-row">
                <div>Landing Page</div>
                <div class="status-completed">Completed</div>
                <div>$1,200</div>
            </div>
            <hr class="project-divider">
            <div class="project-row-secondary">
                <div>Dashboard UI</div>
                <div class="status-progress">In Progress</div>
                <div>$3,400</div>
            </div>
        </footer>
    </main>

</body>

</html>
